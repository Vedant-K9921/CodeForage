<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GitClone{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a class="logo" href="/">GitClone</a>
    <form class="search" action="/search" method="get">
      <input type="text" name="q" placeholder="Search repositories...">
    </form>
    <div class="nav-links">
      {% if user %}
        <a href="/dashboard">Dashboard</a>
        <a href="/repo/new">+ New repo</a>
        <a href="/{{ user.username }}">{{ user.username }}</a>
        <a href="/logout">Logout</a>
      {% else %}
        <a href="/login">Login</a>
        <a class="btn" href="/register">Sign up</a>
      {% endif %}
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">GitClone - college project</footer>
</body>
</html>
